version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: lrbapp-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lrbapp
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lrbapp-backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/lrbapp?schema=public
      PORT: 3001
      NODE_ENV: development
      ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run dev

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: lrbapp-frontend
    environment:
      VITE_API_URL: http://localhost:3001/api
    ports:
      - '5173:5173'
    depends_on:
      - backend
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - /app/node_modules
    command: npm run dev -- --host

volumes:
  postgres_data:
