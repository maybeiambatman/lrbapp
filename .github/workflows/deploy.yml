name: Deploy to GCP

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        type: choice
        options:
          - dev
          - prod

env:
  NODE_VERSION: "20"
  TERRAFORM_VERSION: "1.5.7"

jobs:
  test:
    name: Test Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint || true

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test || echo "No tests configured yet"

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine environment
        id: env
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev

      - name: Build and push Docker image
        env:
          ENVIRONMENT: ${{ steps.env.outputs.environment }}
        run: |
          PROJECT_ID="${{ secrets.GCP_PROJECT_ID }}"
          REGION="${{ secrets.GCP_REGION }}"
          IMAGE_NAME="$REGION-docker.pkg.dev/$PROJECT_ID/lrbapp-backend-$ENVIRONMENT/backend"
          IMAGE_TAG="${{ github.sha }}"

          docker build -t "$IMAGE_NAME:$IMAGE_TAG" -t "$IMAGE_NAME:latest" ./backend
          docker push "$IMAGE_NAME:$IMAGE_TAG"
          docker push "$IMAGE_NAME:latest"

          echo "IMAGE_NAME=$IMAGE_NAME:$IMAGE_TAG" >> $GITHUB_ENV

      - name: Save image name
        run: echo "${{ env.IMAGE_NAME }}" > image-name.txt

      - name: Upload image name artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-name
          path: image-name.txt

  deploy-infrastructure:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    needs: build
    environment: ${{ needs.build.outputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine environment
        id: env
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
          fi

      - name: Download image name artifact
        uses: actions/download-artifact@v4
        with:
          name: image-name

      - name: Read image name
        id: image
        run: echo "name=$(cat image-name.txt)" >> $GITHUB_OUTPUT

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Terraform Init
        working-directory: ./terraform
        env:
          ENVIRONMENT: ${{ steps.env.outputs.environment }}
        run: |
          terraform init -backend-config="environments/$ENVIRONMENT/backend.tfvars"

      - name: Terraform Workspace
        working-directory: ./terraform
        env:
          ENVIRONMENT: ${{ steps.env.outputs.environment }}
        run: |
          terraform workspace select $ENVIRONMENT || terraform workspace new $ENVIRONMENT

      - name: Terraform Plan
        working-directory: ./terraform
        env:
          ENVIRONMENT: ${{ steps.env.outputs.environment }}
          TF_VAR_backend_image: ${{ steps.image.outputs.name }}
          TF_VAR_database_password: ${{ secrets.DATABASE_PASSWORD }}
        run: |
          terraform plan \
            -var-file="environments/$ENVIRONMENT/terraform.tfvars" \
            -var="backend_image=$TF_VAR_backend_image" \
            -out=tfplan

      - name: Terraform Apply
        working-directory: ./terraform
        env:
          ENVIRONMENT: ${{ steps.env.outputs.environment }}
          TF_VAR_backend_image: ${{ steps.image.outputs.name }}
          TF_VAR_database_password: ${{ secrets.DATABASE_PASSWORD }}
        run: |
          terraform apply -auto-approve tfplan

      - name: Get Backend URL
        id: backend-url
        working-directory: ./terraform
        run: |
          BACKEND_URL=$(terraform output -raw backend_url)
          echo "url=$BACKEND_URL" >> $GITHUB_OUTPUT
          echo "Backend deployed at: $BACKEND_URL"

      - name: Comment PR with deployment URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚀 Backend deployed to: ${{ steps.backend-url.outputs.url }}'
            })

  migrate-database:
    name: Run Database Migrations
    runs-on: ubuntu-latest
    needs: deploy-infrastructure

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine environment
        id: env
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Install Cloud SQL Proxy
        run: |
          curl -o cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.8.2/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy
          sudo mv cloud-sql-proxy /usr/local/bin/

      - name: Get database connection info
        id: db-info
        working-directory: ./terraform
        env:
          ENVIRONMENT: ${{ steps.env.outputs.environment }}
        run: |
          terraform workspace select $ENVIRONMENT
          DB_CONNECTION_NAME=$(terraform output -raw database_connection_name)
          echo "connection_name=$DB_CONNECTION_NAME" >> $GITHUB_OUTPUT

      - name: Start Cloud SQL Proxy
        run: |
          cloud-sql-proxy ${{ steps.db-info.outputs.connection_name }} --port=5433 &
          sleep 5

      - name: Run Prisma Migrations
        working-directory: ./backend
        env:
          ENVIRONMENT: ${{ steps.env.outputs.environment }}
        run: |
          # Get DATABASE_URL from Secret Manager
          DATABASE_URL=$(gcloud secrets versions access latest \
            --secret="lrbapp-database-url-$ENVIRONMENT" \
            --project="${{ secrets.GCP_PROJECT_ID }}")

          # Replace host with localhost:5433 for proxy
          LOCAL_DB_URL=$(echo "$DATABASE_URL" | sed 's/@[^:]*:5432/@localhost:5433/')
          export DATABASE_URL="$LOCAL_DB_URL"

          npx prisma migrate deploy
